[package]
name = "craft3d-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft3d-math.workspace = true
craft3d-tess.workspace = true
craft3d-render.workspace = true
craft3d-engine.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
# The viewport's GPU renderer, and egui-wgpu to draw it on the window's own
# device (in the browser too: WebGPU or WebGL2, `crate::direct`).
craft3d-gpu.workspace = true
egui-wgpu.workspace = true
# Reads the start screen's logo and example thumbnails, PNGs built into
# the program (`shell/start.rs`).
png.workspace = true

# Blocks on wgpu's futures when a render state is made without a window
# (`direct::headless_render_state`: tests and examples); the browser
# cannot block.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# In the browser: wgpu's types are shared as on native (one thread, no
# atomics), and the page's clock, which `std::time` lacks there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
web-time.workspace = true

[dev-dependencies]
# The GPU viewport's parity test includes the GPU crate's own comparison.
craft3d-gpu.workspace = true
