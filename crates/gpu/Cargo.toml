[package]
name = "craft3d-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft3d-math.workspace = true
craft3d-tess.workspace = true
craft3d-render.workspace = true
wgpu.workspace = true

# Blocking entry points exist on native targets only; the browser has no
# way to block on a future.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[dev-dependencies]
# The GLSL ES 3.00 translation of every shader (renderer.rs template_tests)
# on every platform: wgpu turns naga's glsl-out on only with its OpenGL
# backend, which macOS builds without.
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }
craft3d-testkit.workspace = true
# The hollow body of the section tests is made by a boolean.
craft3d-kernel.workspace = true
