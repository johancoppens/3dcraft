allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Rule 5 (AGENTS.md): the standard library's transcendental functions call
# the platform's maths library, whose last bits differ by platform. Use
# craft3d_math::Portable (psin, pcos, ...; docs/design/geometry.md, Portable
# maths), or the `libm` crate in the standalone crates.
disallowed-methods = [
    { path = "f64::sin", reason = "platform-dependent bits: use craft3d_math::Portable::psin" },
    { path = "f64::cos", reason = "platform-dependent bits: use craft3d_math::Portable::pcos" },
    { path = "f64::sin_cos", reason = "platform-dependent bits: use craft3d_math::Portable::psin_cos" },
    { path = "f64::tan", reason = "platform-dependent bits: use craft3d_math::Portable::ptan" },
    { path = "f64::asin", reason = "platform-dependent bits: use craft3d_math::Portable::pasin" },
    { path = "f64::acos", reason = "platform-dependent bits: use craft3d_math::Portable::pacos" },
    { path = "f64::atan", reason = "platform-dependent bits: use craft3d_math::Portable::patan" },
    { path = "f64::atan2", reason = "platform-dependent bits: use craft3d_math::Portable::patan2" },
    { path = "f64::sinh", reason = "platform-dependent bits: use craft3d_math::Portable::psinh" },
    { path = "f64::cosh", reason = "platform-dependent bits: use craft3d_math::Portable::pcosh" },
    { path = "f64::tanh", reason = "platform-dependent bits: use craft3d_math::Portable::ptanh" },
    { path = "f64::asinh", reason = "platform-dependent bits: use craft3d_math::Portable::pasinh" },
    { path = "f64::acosh", reason = "platform-dependent bits: use craft3d_math::Portable::pacosh" },
    { path = "f64::atanh", reason = "platform-dependent bits: use craft3d_math::Portable::patanh" },
    { path = "f64::exp", reason = "platform-dependent bits: use craft3d_math::Portable::pexp" },
    { path = "f64::exp2", reason = "platform-dependent bits: use craft3d_math::Portable::pexp2" },
    { path = "f64::exp_m1", reason = "platform-dependent bits: use craft3d_math::Portable::pexp_m1" },
    { path = "f64::ln", reason = "platform-dependent bits: use craft3d_math::Portable::pln" },
    { path = "f64::ln_1p", reason = "platform-dependent bits: use craft3d_math::Portable::pln_1p" },
    { path = "f64::log", reason = "platform-dependent bits: use craft3d_math::Portable::plog" },
