[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/johancoppens/3dcraft"

[workspace.dependencies]
craft3d-math = { path = "crates/math" }
craft3d-geom = { path = "crates/geom" }
craft3d-topo = { path = "crates/topo" }
craft3d-expr = { path = "crates/expr" }
craft3d-doc = { path = "crates/doc" }
craft3d-ops = { path = "crates/ops" }
craft3d-kernel = { path = "crates/kernel" }
craft3d-solve = { path = "crates/solve" }
craft3d-regen = { path = "crates/regen" }
craft3d-format = { path = "crates/format" }
craft3d-engine = { path = "crates/engine" }
craft3d-automation = { path = "crates/automation" }
craft3d-ui-egui = { path = "crates/ui-egui" }
craft3d-tess = { path = "crates/tess" }
craft3d-render = { path = "crates/render" }
craft3d-gpu = { path = "crates/gpu" }
craft3d-testkit = { path = "crates/testkit" }
craft3d-meshio = { path = "crates/meshio" }
craft3d-step = { path = "crates/step" }
craft3d-zipstore = { path = "crates/zipstore" }
craft3d-io = { path = "crates/io" }
# Not modelling code: image encoding only (decisions.md, D10).
png = "0.17"
# The shell: native egui/eframe on wgpu (AGENTS.md). Default features are
# trimmed: no accesskit, no link opening, no persistence.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
# One wgpu for the renderer and the shell: the version eframe 0.36 uses.
wgpu = "30.0.1"
# The shell draws the viewport on eframe's own device through egui-wgpu
# (a paint target registered as an egui texture); no window of its own.
egui-wgpu = { version = "0.36", default-features = false }
# Blocks on wgpu's futures in the native entry points of craft3d-gpu only.
pollster = "1.0.1"
# The desktop app's open and save dialogs only: the system's own dialog
# (xdg-desktop-portal on Linux, no GTK), MIT.
rfd = "0.17"
# The control token only (docs/control-protocol.md, Authentication).
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Never crash (AGENTS.md §3). clippy.toml allows these in tests only.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
# Geometry and rasterising are unusable at opt-level 0.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
