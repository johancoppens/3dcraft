[package]
name = "craft3d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft3d-engine.workspace = true
craft3d-regen.workspace = true
craft3d-automation.workspace = true
craft3d-ui-egui.workspace = true
eframe.workspace = true
getrandom.workspace = true
log.workspace = true
# The window icon (app.rs); already in the tree through the renderers.
png.workspace = true
rfd.workspace = true
serde_json.workspace = true
# Window decorations on Wayland: GNOME draws none for a window, so winit
# draws the title bar and borders itself (sctk-adwaita, the GNOME look;
# only built for Wayland targets). eframe's default features would bring
# it, but the workspace turns those off (docs/development.md, Window).
winit = { workspace = true, features = ["wayland-csd-adwaita"] }

[dev-dependencies]
png.workspace = true

# The commit the program is built from, for the bug report (build.rs).
[build-dependencies]
craft3d-buildinfo.workspace = true
