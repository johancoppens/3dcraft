[package]
name = "craft3d-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# A library: the page loads it as a WebAssembly module (`cdylib`, through
# wasm-bindgen), and the host logic that is not the page's is tested
# natively (`rlib`). `cargo xtask package --formats web` builds the site.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
craft3d-engine.workspace = true
craft3d-ui-egui.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true

# The page: eframe's web runner on wgpu (WebGPU, or WebGL2), and the
# bindings to the browser. Nothing of it is built natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe.workspace = true
egui-wgpu.workspace = true
log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Response",
    "Storage",
    "Url",
    "Window",
] }
