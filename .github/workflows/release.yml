name: Release

# The installers of 3DCraft (docs/development.md, Packaging), built on
# GitHub-hosted runners by `cargo xtask package`:
#   Linux    3dcraft-<version>-x86_64-linux.tar.gz, 3DCraft-<version>-x86_64.AppImage
#   macOS    3DCraft-<version>-aarch64.dmg (3DCraft.app, ad-hoc signed, not notarised)
#   Windows  3dcraft-<version>-x86_64-windows.zip, 3DCraft-<version>-x86_64.msi
#   Web      3dcraft-web-<version>.zip (a static site, packaging/web/HOSTING.md)
# and SHA256SUMS.txt over all of them (what an updater of the web build
# checks before it unpacks it).
# Started by hand (the packages are kept as run artifacts):
#   gh workflow run Release && gh run watch
# or by pushing a tag `v<version>` matching the workspace version, which
# also makes a draft GitHub release with the packages for the developer to
# publish, its notes taken from CHANGELOG.md's section for that version. macOS minutes count tenfold in a private repository.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the binaries need the glibc they
          # were linked against or newer.
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-14
          - name: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
          if ! awk -v head="## [$version]" 'index($0, head) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no section ## [$version] for the release notes" >&2
            exit 1
          fi

      # appimagetool needs `file` and `desktop-file-validate`, and without a
      # runtime file it downloads the newest continuous type2 runtime; both
      # downloads are pinned to a release and checked against its sha256.
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends file desktop-file-utils
          mkdir -p target/tools
          curl -fsSL -o target/tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o target/tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<'SUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  target/tools/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  target/tools/runtime-x86_64
          SUMS
          chmod +x target/tools/appimagetool
          echo "APPIMAGETOOL=$PWD/target/tools/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$PWD/target/tools/runtime-x86_64" >> "$GITHUB_ENV"

      - name: WiX Toolset
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: package
        run: cargo xtask package --out dist

      # The packaged programs start and answer without a window.
      - name: smoke test (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/smoke
          tar -xzf dist/*.tar.gz -C target/smoke
          target/smoke/*/bin/craft3d --version
          target/smoke/*/bin/craft3d-cli --version
          target/smoke/*/bin/craft3d-cli commands > target/smoke/commands.txt
          test -s target/smoke/commands.txt
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage cli --version
      - name: smoke test (macos)
        if: runner.os == 'macOS'
        run: |
          app=dist/stage/dmg/3DCraft.app
          "$app/Contents/MacOS/craft3d" --version
          "$app/Contents/MacOS/craft3d-cli" --version
          "$app/Contents/MacOS/craft3d-cli" commands > /dev/null
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep "$app"
          hdiutil verify dist/*.dmg
      - name: smoke test (windows)
        if: runner.os == 'Windows'
        run: |
          dir=$(ls -d dist/stage/3dcraft-*-windows)
          "$dir/craft3d.exe" --version
          "$dir/craft3d-cli.exe" --version
          "$dir/craft3d-cli.exe" commands > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: 3dcraft-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.msi

  # The browser build: wasm-bindgen's CLI of the version in Cargo.lock and
  # binaryen's wasm-opt, both release downloads pinned and checked against
  # their sha256 (docs/development.md, Web build).
  web:
    name: package (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi

      - name: tools
        run: |
          rustup target add wasm32-unknown-unknown
          mkdir -p target/tools
          curl -fsSL -o target/tools/wasm-bindgen.tar.gz \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o target/tools/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          sha256sum -c - <<'SUMS'
          82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  target/tools/wasm-bindgen.tar.gz
          2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  target/tools/binaryen.tar.gz
          SUMS
          tar -xzf target/tools/wasm-bindgen.tar.gz -C target/tools
          tar -xzf target/tools/binaryen.tar.gz -C target/tools
          echo "WASM_BINDGEN=$PWD/target/tools/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
          echo "WASM_OPT=$PWD/target/tools/binaryen-version_133/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: package
        run: cargo xtask package --formats web --out dist

      # The site is one folder with one page, whose module and glue have
      # the 16-digit hashed names a server caches forever.
      - name: smoke test
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          mkdir -p ../target/smoke && unzip -q 3dcraft-web-*.zip -d ../target/smoke
          site=$(ls -d ../target/smoke/3dcraft-web-*)
          test "$(find ../target/smoke -name index.html | wc -l)" = 1
          ls "$site"/craft3d-web-*_bg.wasm | grep -Eq -- '-[0-9a-f]{16}_bg\.wasm$'
          ls "$site"/craft3d-web-*.js | grep -Eq -- '-[0-9a-f]{16}\.js$'
          grep -q 'rel="manifest"' "$site/index.html"
          grep -q '?webgl' "$site/HOSTING.md"
          test -s "$site/.htaccess" && test -s "$site/_headers" && test -s "$site/icon-512.png"

      - uses: actions/upload-artifact@v4
        with:
          name: 3dcraft-web
          if-no-files-found: error
          path: |
            dist/3dcraft-web-*.zip
            dist/SHA256SUMS.txt

  # Only for a tag: a draft release with every package; publishing it is
  # the developer's step.
  release:
    name: draft release
    needs: [package, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release notes are CHANGELOG.md's section for the tag: from its
      # `## [<version>]` heading to the next heading of that level or the
      # link definitions at the end (checked to exist before the build).
      - name: release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, head) == 1); next }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' src/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no notes under ## [$version]" >&2
            exit 1
          fi
          printf '\nThe installers are not signed yet; [the install guide](https://github.com/%s/blob/%s/docs/guide/01-install.md) says what your system shows and how to open them anyway.\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          cat notes.md
      - name: checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "3DCraft ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
