name: Release

# The installers of 3DCraft (docs/development.md, Packaging), built on
# GitHub-hosted runners by `cargo xtask package`:
#   Linux    3dcraft-<version>-x86_64-linux.tar.gz, 3DCraft-<version>-x86_64.AppImage
#            and its .zsync (what a desktop tool updates the AppImage from)
#   macOS    3DCraft-<version>-aarch64.dmg (3DCraft.app, ad-hoc signed, not notarised)
#   Windows  3dcraft-<version>-x86_64-windows.zip, 3DCraft-<version>-x86_64.msi
#   Web      3dcraft-web-<version>.zip (a static site, packaging/web/HOSTING.md)
# and SHA256SUMS.txt over all of them (what an updater of the web build
# checks before it unpacks it).
# Started by hand (the packages are kept as run artifacts; nothing is
# published):
#   gh workflow run Release -R johancoppens/3dcraft && gh run watch -R johancoppens/3dcraft
# or only the web zip, on one Linux runner:
#   gh workflow run Release -R johancoppens/3dcraft -f only=web && gh run watch -R johancoppens/3dcraft
# or only the Windows packages with their smoke test and install check:
#   gh workflow run Release -R johancoppens/3dcraft -f only=windows && gh run watch -R johancoppens/3dcraft
# or by pushing a tag `v<version>` matching the workspace version to the
# public repository (`git push public v<version>`), which also makes a
# draft GitHub release with the packages for the developer to publish,
# its notes taken from CHANGELOG.md's section for that version. It runs
# only in the public repository (`package`, `web`), on GitHub's
# standard hosted runners.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "all: every package; web: only the web zip (one Linux runner); windows: only the Windows packages, their smoke test and install check"
        type: choice
        options: [all, web, windows]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Only in the public repository, johancoppens/3dcraft, to which the
  # hosted jobs belong. The same file is in the workshop,
  # johancoppens/3dcraft-dev, where they are skipped: there a tag or a
  # dispatch skips this job and `web`, and `release`, which needs both, is
  # skipped with them. A job-level `if` cannot read `env`, so the name is
  # written in the `if` of each of the two jobs that need none.
  package:
    name: package (${{ matrix.name }})
    if: >-
      github.repository == 'johancoppens/3dcraft'
      && (github.event_name != 'workflow_dispatch' || inputs.only != 'web')
    strategy:
      fail-fast: false
      # Every platform; with `only: windows` the Windows job alone (a tag
      # has no inputs, so it gets every platform). The images: linux, the
      # oldest supported Ubuntu (the binaries need the glibc they were
      # linked against or newer); macos, the oldest macOS image on Apple
      # Silicon (GitHub retired the macOS 14 images on 2026-11-02; the
      # app's minimum macOS is not the runner's: Rust's default deployment
      # target for aarch64-apple-darwin, 11.0, is what Info.plist's
      # LSMinimumSystemVersion promises); windows, Windows Server 2022.
      matrix:
        include: ${{ fromJSON(inputs.only == 'windows' && '[{"name":"windows","os":"windows-2022"}]' || '[{"name":"linux","os":"ubuntu-22.04"},{"name":"macos","os":"macos-15"},{"name":"windows","os":"windows-2022"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
          if ! awk -v head="## [$version]" 'index($0, head) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no section ## [$version] for the release notes" >&2
            exit 1
          fi

      # appimagetool needs `file` and `desktop-file-validate`, and without a
      # runtime file it downloads the newest continuous type2 runtime; both
      # downloads are pinned to a release and checked against its sha256,
      # and retry. Nothing is installed with apt (the runner's mirror did
      # not resolve for half an hour on 2026-11-11): `file` is on the
      # image, and appimagetool 1.9.1's AppImage brings
      # `desktop-file-validate`, `mksquashfs` and `zsyncmake` in its
      # usr/bin, which its AppRun puts first on PATH. Only a missing `file`
      # is tried with apt, once, for at most five minutes.
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          if ! command -v file > /dev/null; then
            if ! sudo timeout -k 10 300 sh -c 'apt-get -o Acquire::Retries=2 update -q && apt-get -o Acquire::Retries=2 install -y -q --no-install-recommends file'; then
              echo "::error::file is not on the image and apt-get could not install it in 5 minutes: the runner's package mirror (see above)"
              exit 1
            fi
          fi
          command -v file
          mkdir -p target/tools
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o target/tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o target/tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<'SUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  target/tools/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  target/tools/runtime-x86_64
          SUMS
          chmod +x target/tools/appimagetool
          # The tools it brings, unpacked by its runtime (no FUSE needed;
          # the package step runs it with APPIMAGE_EXTRACT_AND_RUN=1): an
          # appimagetool without them fails here, not in the package step.
          tool="$PWD/target/tools/appimagetool"
          (
            cd "$(mktemp -d)"
            "$tool" --appimage-extract > /dev/null
            for name in appimagetool desktop-file-validate mksquashfs zsyncmake; do
              test -x "squashfs-root/usr/bin/$name"
            done
          )
          echo "appimagetool brings desktop-file-validate, mksquashfs and zsyncmake"
          echo "APPIMAGETOOL=$PWD/target/tools/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$PWD/target/tools/runtime-x86_64" >> "$GITHUB_ENV"

      # From NuGet, pinned; tried again after a pause when it fails.
      - name: WiX Toolset
        if: runner.os == 'Windows'
        run: |
          for attempt in 1 2 3; do
            if dotnet tool install --global wix --version 5.0.2; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::dotnet could not install the WiX Toolset 5.0.2 in 3 attempts (see above)"
              exit 1
            fi
            echo "dotnet tool install failed (attempt $attempt of 3); trying again in 30 s"
            sleep 30
          done
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: package
        run: cargo xtask package --out dist

      # The packaged programs start and answer without a window.
      - name: smoke test (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/smoke
          tar -xzf dist/*.tar.gz -C target/smoke
          target/smoke/*/bin/craft3d --version
          target/smoke/*/bin/craft3d-cli --version
          target/smoke/*/bin/craft3d-cli commands > target/smoke/commands.txt
          test -s target/smoke/commands.txt
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage cli --version
      - name: smoke test (macos)
        if: runner.os == 'macOS'
        run: |
          app=dist/stage/dmg/3DCraft.app
          "$app/Contents/MacOS/craft3d" --version
          "$app/Contents/MacOS/craft3d-cli" --version
          "$app/Contents/MacOS/craft3d-cli" commands > /dev/null
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep "$app"
          hdiutil verify dist/*.dmg
          # For the log: the oldest macOS the programs ask for (`minos`),
          # which Info.plist's LSMinimumSystemVersion promises (11.0), and
          # the SDK they were linked with.
          otool -l "$app/Contents/MacOS/craft3d" | grep -A4 LC_BUILD_VERSION || true
      - name: smoke test (windows)
        if: runner.os == 'Windows'
        env:
          # Every start of the launcher in this step writes what it would show
          # in a message box to this file instead: on a runner a box would
          # wait for the job's time limit.
          CRAFT3D_LAUNCHER_LOG: ${{ runner.temp }}/launcher.log
        run: |
          dir=$(ls -d dist/stage/3dcraft-*-windows)
          "$dir/craft3d.exe" --version
          "$dir/craft3d-cli.exe" --version
          "$dir/craft3d-cli.exe" commands > /dev/null
          # The launcher, 3DCraft.exe (the Windows GUI subsystem: the package
          # log says so), starts craft3d.exe beside it with its arguments,
          # and its output passes through...
          said=$("$dir/3DCraft.exe" --version)
          echo "3DCraft.exe --version: $said"
          case "$said" in
            "craft3d "*) ;;
            *) echo "::error::3DCraft.exe --version did not pass craft3d.exe's answer on"; exit 1 ;;
          esac
          log="$CRAFT3D_LAUNCHER_LOG"
          if [ -s "$log" ]; then
            cat "$log"; echo "::error::3DCraft.exe said something for a window that ended well"; exit 1
          fi
          # ...and it says why a window could not start, with its exit code,
          # here as a line in the switch's file. An unknown option is a start
          # that fails without a GPU (the window's exit code 2, passed on).
          if "$dir/3DCraft.exe" --no-such-option; then
            echo "::error::3DCraft.exe ended well for a window that could not start"; exit 1
          fi
          cat "$log"
          grep -q '^craft3d-launcher: 3DCraft could not start (exit code 2)\. | craft3d: unknown flag' "$log"
      # The window drives itself once through the plain, see-through and
      # cut-open pictures of a small model it makes (`CRAFT3D_GPU_TOUR=quick`,
      # apps/craft3d/src/tour.rs) on the runner's adapter (the hosted runner
      # has no GPU: WARP, through DirectX 12), so every Windows build
      # compiles and draws every pipeline of the viewport but the studio
      # look's, whose shaders DirectX 12's compiler (FXC) takes minutes over
      # (docs/design/rendering.md, *Diagnostics of the graphics driver*). It
      # ends by itself; its last line must count no error. The trace
      # (`CRAFT3D_GPU_TRACE`: what the driver was asked to build, the last
      # line naming it if the window dies) and the pictures of the steps are
      # kept as an artifact, also when the step fails. The step cannot hold
      # back a release (it runs before the packages are uploaded, and the
      # draft needs every package job): a failure or a timeout is marked on
      # the run, and its trace is read by hand before a tag
      # (docs/development.md, Releasing a version).
      - name: tour (windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 15
        env:
          CRAFT3D_GPU_TOUR: quick
          CRAFT3D_GPU_TRACE: ${{ runner.temp }}/tour/trace.txt
        run: |
          dir=$(ls -d dist/stage/3dcraft-*-windows)
          mkdir -p "$RUNNER_TEMP/tour/state"
          "$dir/craft3d.exe" --recovery-dir none --recent-file none --state-dir "$RUNNER_TEMP/tour/state"
          tail -n 12 "$CRAFT3D_GPU_TRACE"
          if ! grep -q ' info tour .* done, 0 errors$' "$CRAFT3D_GPU_TRACE"; then
            echo "::error::the tour did not end with 0 errors"; exit 1
          fi
      - name: keep the tour's trace (windows)
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-windows
          path: ${{ runner.temp }}/tour/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: 3dcraft-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.dmg
            dist/*.zip
            dist/*.msi

      # The .msi installed as a person installs it, silently: first the
      # latest published release's, when it is older, then this one over
      # it. The upgrade must leave one 3DCraft in Apps (the UpgradeCode
      # never changes; MajorUpgrade removes the older one), of this
      # version, whose programs answer from Program Files, with the folder
      # on the system PATH. The runner has the Visual C++ runtime, so a
      # start here proves nothing about a PC without it: the import lists
      # `cargo xtask package` writes and checks above are that proof.
      # The installed launcher must pass a double-clicked file's path on
      # whole, and `msiexec /x` must leave nothing behind.
      # After the upload, so the packages are kept whatever it finds; it
      # still fails the job, and with it the draft release: an .msi that
      # leaves two entries must stop a release. A failure that is not the
      # package's (msiexec 1618, another installation busy; GitHub's API)
      # is answered by re-running the job.
      - name: install (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # As in the smoke test: no message box on the runner.
          CRAFT3D_LAUNCHER_LOG: ${{ runner.temp }}/launcher-installed.log
        run: |
          $ErrorActionPreference = 'Stop'
          # A native command's exit code is read by the script (the
          # retries below), never turned into an error that ends it.
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $core = $version -replace '[-+].*$', ''
          $msi = (Resolve-Path "dist/3DCraft-$version-x86_64.msi").Path
          $folder = Join-Path $env:ProgramFiles '3DCraft'
          # msiexec /i (install) or /x (uninstall), silently, with a log.
          function Invoke-Msi([string] $action, [string] $path, [string] $name) {
            $log = Join-Path $env:RUNNER_TEMP "msi-$name.log"
            $run = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @($action, "`"$path`"", '/qn', '/norestart', '/l*v', "`"$log`"")
            # 3010: installed, a restart asked for (not done: /norestart).
            if ($run.ExitCode -ne 0 -and $run.ExitCode -ne 3010) {
              if (Test-Path -LiteralPath $log) {
                Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue | Write-Host
              } else {
                Write-Host "msiexec wrote no log at $log"
              }
              $why = if ($run.ExitCode -eq 1618) { ' (1618: another installation is in progress; re-run the job)' } else { '' }
              throw "msiexec $action $path ended with $($run.ExitCode)$why"
            }
            Write-Host "msiexec $action $path ended with $($run.ExitCode)"
          }
          # A property of a COM object read through IDispatch
          # (Type.InvokeMember, BindingFlags.GetProperty): the Windows
          # Installer's properties take parameters, which PowerShell's COM
          # adapter may not offer. The object and every argument go as plain
          # .NET values in a new object[]: a value PowerShell has wrapped (a
          # PSObject, as Join-Path's string is) reaches IDispatch as a type it
          # cannot convert, DISP_E_TYPEMISMATCH (the first rehearsal,
          # 2026-11-13, run 43488640983).
          function Get-ComProperty($object, [string] $name, [object[]] $arguments) {
            $plain = [object[]]::new($arguments.Count)
            for ($i = 0; $i -lt $arguments.Count; $i++) { $plain[$i] = $arguments[$i].psobject.BaseObject }
            $target = $object.psobject.BaseObject
            $target.GetType().InvokeMember($name, [System.Reflection.BindingFlags]::GetProperty, $null, $target, $plain)
          }
          # Each check below runs whatever failed before it; its failure is
          # collected, said at once, and the step fails at the end with all of
          # them (one rehearsal is an hour of a hosted Windows runner).
          $failures = [System.Collections.Generic.List[string]]::new()
          function Check([string] $what, [scriptblock] $test) {
            try {
              & $test
              Write-Host "ok: $what"
            } catch {
              $failures.Add("${what}: $($_.Exception.Message)")
              Write-Host "::error::${what}: $($_.Exception.Message)"
            }
          }
          function Test-OnPath {
            $path = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
            [bool]($path -split ';' | Where-Object { $_.TrimEnd('\') -eq $folder })
          }
          # What Apps (Settings) and Programs and Features list: the
          # uninstall keys, in both registry views.
          function Get-Entries {
            Get-ItemProperty -ErrorAction SilentlyContinue -Path @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            ) | Where-Object { $_.DisplayName -eq '3DCraft' }
          }
          function Assert-One([string] $want) {
            $entries = @(Get-Entries)
            $entries | Format-Table -AutoSize DisplayName, DisplayVersion, PSChildName | Out-String | Write-Host
            if ($entries.Count -ne 1) {
              throw "Apps lists $($entries.Count) entries named 3DCraft, not one"
            }
            if ($entries[0].DisplayVersion -ne $want) {
              throw "Apps lists 3DCraft $($entries[0].DisplayVersion), not $want"
            }
          }
          $previous = $null
          for ($attempt = 1; $attempt -le 3 -and -not $previous; $attempt++) {
            $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
            if ($LASTEXITCODE -eq 0 -and $tag) { $previous = "$tag".Trim() } else { Start-Sleep -Seconds 20 }
          }
          if (-not $previous) { throw "the latest published release could not be read (gh release view, 3 attempts)" }
          $older = $previous.TrimStart('v') -replace '[-+].*$', ''
          if ([version]$older -lt [version]$core) {
            $dir = Join-Path $env:RUNNER_TEMP 'previous'
            $fetched = $false
            for ($attempt = 1; $attempt -le 3 -and -not $fetched; $attempt++) {
              gh release download $previous --repo $env:GITHUB_REPOSITORY --pattern '3DCraft-*-x86_64.msi' --dir $dir --clobber
              if ($LASTEXITCODE -eq 0) { $fetched = $true } else { Start-Sleep -Seconds 20 }
            }
            if (-not $fetched) { throw "the .msi of $previous could not be downloaded (3 attempts)" }
            $old = (Get-ChildItem -Path $dir -Filter '3DCraft-*-x86_64.msi' | Select-Object -First 1).FullName
            Invoke-Msi '/i' $old 'previous'
            Assert-One $older
          } else {
            Write-Host "::notice::the latest published release is $previous, not older than ${version}: this .msi is installed without an upgrade"
          }
          Invoke-Msi '/i' $msi 'this'
          Assert-One $core
          $launcher = Join-Path $folder '3DCraft.exe'
          $lnk = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\3DCraft.lnk'
          Check 'both console programs answer --version from Program Files' {
            foreach ($program in 'craft3d.exe', 'craft3d-cli.exe') {
              $said = & (Join-Path $folder $program) --version
              if ($LASTEXITCODE -ne 0 -or "$said" -notmatch [regex]::Escape(" $version ")) {
                throw "$folder\$program --version said: $said"
              }
              Write-Host "$program from Program Files: $said"
            }
          }
          # The Start menu entry starts the launcher. The shortcut is
          # advertised (packaging/windows/craft3d.wxs, Advertise="yes"): it
          # names a product, a feature and a component, whose key path is the
          # program. Two ways are tried and each says what it found; either
          # one that gives the launcher will do.
          Check 'the Start menu entry starts the launcher' {
            if (-not (Test-Path -LiteralPath $launcher)) { throw "$launcher was not installed" }
            if (-not (Test-Path -LiteralPath $lnk)) { throw "the Start menu entry $lnk is missing" }
            $found = [System.Collections.Generic.List[string]]::new()
            # Installer.ShortcutTarget(string ShortcutPath) is a Record of
            # three fields, product code, feature and component code;
            # Record.StringData(long Field), 1-based, gives each as a string;
            # Installer.ComponentPath(string Product, string Component) the
            # component's key path (Microsoft's Windows Installer automation
            # reference). Passed: [string], [int], [string] and [string].
            try {
              $installer = New-Object -ComObject WindowsInstaller.Installer
              $record = Get-ComProperty $installer 'ShortcutTarget' @([string]$lnk)
              $product = [string](Get-ComProperty $record 'StringData' @([int]1))
              $feature = [string](Get-ComProperty $record 'StringData' @([int]2))
              $component = [string](Get-ComProperty $record 'StringData' @([int]3))
              $path = [string](Get-ComProperty $installer 'ComponentPath' @($product, $component))
              Write-Host "the Windows Installer: ShortcutTarget([string] $lnk) gave product $product, feature $feature, component $component; ComponentPath([string], [string]) gave $path"
              $found.Add($path)
            } catch {
              Write-Host "the Windows Installer's way failed: $($_.Exception.Message)"
            }
            # WScript.Shell's CreateShortcut(string).TargetPath, an ordinary
            # method and property: a plain shortcut's target (an advertised
            # one may give another file, such as its icon).
            try {
              $shell = New-Object -ComObject WScript.Shell
              $path = [string]$shell.CreateShortcut([string]$lnk).TargetPath
              Write-Host "WScript.Shell: CreateShortcut([string] $lnk).TargetPath gave $path"
              $found.Add($path)
            } catch {
              Write-Host "WScript.Shell's way failed: $($_.Exception.Message)"
            }
            if (-not ($found | Where-Object { $_ -eq $launcher })) {
              throw "no way gave $launcher as its target (found: $($found -join '; '))"
            }
          }
          # A double-clicked .3dcraft, .3dcraftjig and .3dcraftasm too: each
          # names its file type, whose open verb the launcher's component
          # carries (packaging/windows/craft3d.wxs).
          Check 'the three file types are registered' {
            foreach ($pair in @(@('.3dcraft', 'Craft3D.Document.1'), @('.3dcraftjig', 'Craft3D.Jig.1'), @('.3dcraftasm', 'Craft3D.Assembly.1'))) {
              $named = (Get-ItemProperty -LiteralPath "Registry::HKEY_CLASSES_ROOT\$($pair[0])").'(default)'
              if ($named -ne $pair[1]) { throw "$($pair[0]) names $named, not $($pair[1])" }
            }
          }
          Check 'the system PATH names the folder' {
            if (-not (Test-OnPath)) { throw "the system PATH does not name $folder" }
          }
          # The installed launcher passes a double-clicked file's path on
          # whole: spaces, % and ^ (Start-Process hands the command line to
          # Windows as written, no shell stands between to expand them),
          # through std's quoting of craft3d.exe's command line. The window
          # refuses a file that is not there before its window exists, naming
          # it; the launcher writes that line to the switch's file.
          Check 'the installed launcher passes a path with spaces, % and ^ whole' {
            $file = 'C:\a b\x %y% ^z\no such.3dcraft'
            $run = Start-Process -FilePath $launcher -ArgumentList "`"$file`"" -Wait -PassThru
            $log = $env:CRAFT3D_LAUNCHER_LOG
            # .NET's ReadAllText: '' for an empty file, where Get-Content -Raw
            # gives $null (also through a [string] cast) and .Contains throws.
            $said = ''
            if (Test-Path -LiteralPath $log) { $said = [System.IO.File]::ReadAllText([string]$log) }
            Write-Host "3DCraft.exe `"$file`" ended with $($run.ExitCode) and said: $said"
            if ($run.ExitCode -eq 0) { throw "3DCraft.exe ended well for a file that is not there" }
            if (-not $said.Contains($file)) { throw "the launcher's line does not name $file whole" }
          }
          # Uninstalled, nothing of it is left: no entry in Apps, no Start menu
          # entry, no file types, no files, no PATH entry; every leftover said.
          Check 'msiexec /x leaves nothing behind' {
            Invoke-Msi '/x' $msi 'uninstall'
            # A file the system still holds is removed a moment later: up to
            # 30 seconds for the folder and the Start menu entry to go.
            for ($i = 0; $i -lt 30 -and ((Test-Path -LiteralPath $folder) -or (Test-Path -LiteralPath $lnk)); $i++) { Start-Sleep -Seconds 1 }
            $left = [System.Collections.Generic.List[string]]::new()
            if (@(Get-Entries).Count -ne 0) { $left.Add('an entry in Apps') }
            if (Test-Path -LiteralPath $lnk) { $left.Add("the Start menu entry $lnk") }
            foreach ($key in '.3dcraft', '.3dcraftjig', '.3dcraftasm', 'Craft3D.Document.1', 'Craft3D.Jig.1', 'Craft3D.Assembly.1') {
              if (Test-Path -LiteralPath "Registry::HKEY_CLASSES_ROOT\$key") { $left.Add("HKEY_CLASSES_ROOT\$key") }
            }
            if (Test-Path -LiteralPath $folder) {
              Get-ChildItem -LiteralPath $folder -Recurse -Force | ForEach-Object { Write-Host "left: $($_.FullName)" }
              $left.Add($folder)
            }
            if (Test-OnPath) { $left.Add("$folder on the system PATH") }
            if ($left.Count -gt 0) { throw "left behind: $($left -join '; ')" }
          }
          if ($failures.Count -gt 0) {
            Write-Host "$($failures.Count) check(s) failed:"
            $failures | ForEach-Object { Write-Host "  $_" }
            throw "$($failures.Count) check(s) failed (above)"
          }
          Write-Host "every check passed"

  # The browser build: wasm-bindgen's CLI of the version in Cargo.lock and
  # binaryen's wasm-opt, both release downloads pinned and checked against
  # their sha256 (docs/development.md, Web build).
  web:
    name: package (web)
    # Only in the public repository, as `package` above; not for a
    # rehearsal of Windows alone.
    if: >-
      github.repository == 'johancoppens/3dcraft'
      && (github.event_name != 'workflow_dispatch' || inputs.only != 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi

      - name: tools
        run: |
          rustup target add wasm32-unknown-unknown
          mkdir -p target/tools
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o target/tools/wasm-bindgen.tar.gz \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o target/tools/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          sha256sum -c - <<'SUMS'
          82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  target/tools/wasm-bindgen.tar.gz
          2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  target/tools/binaryen.tar.gz
          SUMS
          tar -xzf target/tools/wasm-bindgen.tar.gz -C target/tools
          tar -xzf target/tools/binaryen.tar.gz -C target/tools
          echo "WASM_BINDGEN=$PWD/target/tools/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
          echo "WASM_OPT=$PWD/target/tools/binaryen-version_133/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: package
        run: cargo xtask package --formats web --out dist

      # The site is one folder with one page, whose module and glue have
      # the 16-digit hashed names a server caches forever.
      - name: smoke test
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          mkdir -p ../target/smoke && unzip -q 3dcraft-web-*.zip -d ../target/smoke
          site=$(ls -d ../target/smoke/3dcraft-web-*)
          test "$(find ../target/smoke -name index.html | wc -l)" = 1
          ls "$site"/craft3d-web-*_bg.wasm | grep -Eq -- '-[0-9a-f]{16}_bg\.wasm$'
          ls "$site"/craft3d-web-*.js | grep -Eq -- '-[0-9a-f]{16}\.js$'
          worker=$(ls "$site"/craft3d-worker-*.js)
          echo "$worker" | grep -Eq -- '-[0-9a-f]{16}\.js$'
          grep -q "content=\"./$(basename "$worker")\"" "$site/index.html"
          grep -q "from './$(basename "$site"/craft3d-web-*.js)'" "$worker"
          grep -q 'rel="manifest"' "$site/index.html"
          grep -q '?webgl' "$site/HOSTING.md"
          test -s "$site/.htaccess" && test -s "$site/_headers" && test -s "$site/icon-512.png"

      - uses: actions/upload-artifact@v4
        with:
          name: 3dcraft-web
          if-no-files-found: error
          path: |
            dist/3dcraft-web-*.zip
            dist/SHA256SUMS.txt

  # Only for a tag: a draft release with every package; publishing it is
  # the developer's step.
  release:
    name: draft release
    needs: [package, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release notes are CHANGELOG.md's section for the tag: from its
      # `## [<version>]` heading to the next heading of that level or the
      # link definitions at the end (checked to exist before the build).
      - name: release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, head) == 1); next }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' src/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no notes under ## [$version]" >&2
            exit 1
          fi
          printf '\nThe installers are not signed yet; [the install guide](https://github.com/%s/blob/%s/docs/guide/install.md) says what your system shows and how to open them anyway.\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          cat notes.md
      - name: checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "3DCraft ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
