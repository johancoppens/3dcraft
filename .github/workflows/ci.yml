name: CI

# Not on every push: nobody uses the software yet, and the full suite on
# three platforms costs about 25 runner-minutes (macOS counts tenfold in a
# private repository). `cargo xtask ci` is run locally before every commit
# and covers everything the Linux job does; what this adds is macOS and
# Windows. Run it by hand before anything that must be certain:
#   gh workflow run CI && gh run watch
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have about 14 GB of disk and 16 GB of memory; the
  # workspace's test binaries outgrew the disk (2026-10-26 "No space left
  # on device"; 2026-10-30 the linker killed by SIGBUS, which is how a
  # full disk or /tmp shows in `ld`). No debug information in CI makes
  # the binaries several times smaller (a failure's backtrace still names
  # the functions), and fewer jobs keep the linkers' memory down.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  # The full gate: fmt, clippy, tests, layering, wasm. The toolchain comes
  # from rust-toolchain.toml (rustup installs it on first use).
  gate:
    name: gate (linux)
    runs-on: ubuntu-latest
    steps:
      # Room for the build: the preinstalled SDKs we never use (the disk
      # before and after, in the log).
      - run: |
          df -h / /tmp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /tmp
      - uses: actions/checkout@v4
      # The built-in fonts (never committed), pinned by URL and SHA-256,
      # into assets/fonts where the text tests find them.
      - run: cargo xtask fonts
      - run: cargo xtask ci
      # What the build left: the disk and the target directory's size,
      # also when it failed.
      - if: always()
        run: |
          df -h / /tmp
          du -sh target 2>/dev/null || true

  # Tests on the other platforms.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The built-in fonts (never committed), pinned by URL and SHA-256,
      # into assets/fonts where the text tests find them.
      - run: cargo xtask fonts
      # Every crate's failures in one run, not only the first crate's.
      - run: cargo test --workspace --no-fail-fast
      - if: always()
        shell: bash
        run: |
          df -h . || true
          du -sh target 2>/dev/null || true
