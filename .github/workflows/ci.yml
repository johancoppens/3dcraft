name: CI

# Not on every push: nobody uses the software yet, and the full suite on
# three platforms costs about 25 runner-minutes (macOS counts tenfold in a
# private repository). `cargo xtask ci` is run locally before every commit
# and covers everything the Linux job does; what this adds is macOS and
# Windows. Run it by hand before anything that must be certain:
#   gh workflow run CI && gh run watch
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full gate: fmt, clippy, tests, layering, wasm. The toolchain comes
  # from rust-toolchain.toml (rustup installs it on first use).
  gate:
    name: gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask ci

  # Tests on the other platforms.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
