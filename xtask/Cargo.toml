[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft3d-math.workspace = true
serde_json.workspace = true
# SHA-256 for the web build's file names and SHA256SUMS.txt (`web.rs`).
craft3d-doc.workspace = true
# `cargo xtask bundle-examples`: a bundled file must open in this build
# (`bundle.rs`).
craft3d-format.workspace = true
# `cargo xtask fonts`: the pinned built-in fonts (`fonts.rs`).
craft3d-font.workspace = true
# `cargo xtask web-size`: gzip -9 of the web module, with the pure-Rust
# backend (miniz_oxide), so the measured size is the same on every machine.
# `cargo xtask example-thumbs`: the pictures of the example scripts, and
# `cargo xtask bundle-examples`: the start screen's thumbnails of the
# bundled examples, read and written as indexed PNGs (`thumbs.rs`,
# `bundle.rs`).
png.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
