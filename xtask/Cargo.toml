[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
# SHA-256 for the web build's file names and SHA256SUMS.txt (`web.rs`).
craft3d-doc.workspace = true
# `cargo xtask web-size`: gzip -9 of the web module, with the pure-Rust
# backend (miniz_oxide), so the measured size is the same on every machine.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
